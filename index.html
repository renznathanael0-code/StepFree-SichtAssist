<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StepFree SichtAssist - Barrierefreie Assistenz</title>
    <link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#000000">


<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SichtAssist">


</head>
<body>

    <header role="banner">
        <h1>SichtAssist</h1>
      <p id="appStatus" aria-live="assertive" role="alert">
  Tippe einmal auf den Bildschirm, um SichtAssist zu starten.
</p>

    </header>

    <main role="main">
        <video id="cameraFeed" autoplay playsinline class="video-preview" aria-hidden="true"></video>

        <div class="button-grid" role="region" aria-label="Steuerungsknöpfe">
            <button id="btnText" class="btn btn-blue" aria-label="Text vorlesen">
                <span>📄 Text</span>
            </button>
            <button id="btnColor" class="btn btn-white" aria-label="Farbe erkennen">
                <span>🎨 Farbe</span>
            </button>
            <button id="btnObject" class="btn btn-yellow" aria-label="Objekt erkennen">
                <span>🔍 Objekt</span>
            </button>
            <button id="btnCurrency" class="btn btn-green" aria-label="Geld erkennen">
                <span>💶 Geld</span>
            </button>
        </div>
    </main>

   <footer role="contentinfo" class="legal-footer">
    <p class="disclaimer">SichtAssist ist eine Orientierungs- und Lesehilfe im Alltag. Nicht zur Navigation im Straßenverkehr zugelassen.</p>
    <nav aria-label="Rechtliches">
        <a href="impressum.html" id="linkImpressum">Impressum</a>
        <a href="datenschutz.html" id="linkDatenschutz">Datenschutz</a>
    </nav>
</footer>



    <script src="app.js"></script>
</body>
</html>
